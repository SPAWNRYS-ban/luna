name: yam/luna
version: 0.2.0
targets: [yandexmini, yandexmicro, yandexmini_2, yandexmini3, yandexmidi, yandexplum]
files:
  bin/luna: target/$YAM_TRIPLE/release/luna
  bin/luna-universal: target/$YAM_TRIPLE/release/luna-universal
  bin/luna-yandexmini: target/$YAM_TRIPLE/release/luna-yandexmini
  bin/luna-yandexmicro: target/$YAM_TRIPLE/release/luna-yandexmicro
  bin/luna-yandexmini_2: target/$YAM_TRIPLE/release/luna-yandexmini_2
  bin/luna-yandexmini3: target/$YAM_TRIPLE/release/luna-yandexmini3
  bin/luna-yandexmidi: target/$YAM_TRIPLE/release/luna-yandexmidi
  bin/luna-yandexplum: target/$YAM_TRIPLE/release/luna-yandexplum
  share/luna/web/: web/
services:
  luna:
    exec: [bin/luna, --data-dir, "${YAM_VAR}"]
    restart: always
    after: [network]
