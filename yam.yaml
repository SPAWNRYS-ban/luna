name: yam/luna
version: 0.2.0
license: MIT
description: Luna host runtime for Lua, Quasar and legacy plugins
targets: [yandexmicro, yandexmini_2, yandexmidi, yandexplum]
files:
  bin/luna: target/$YAM_TRIPLE/release/luna
  share/luna/web/: web/
services:
  luna:
    exec: [bin/luna, --data-dir, "${YAM_VAR}"]
    restart: always
    after: [network]
