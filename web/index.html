<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luna</title>
  <style>
    body { max-width: 900px; margin: 3rem auto; font: 16px system-ui; background: #10131a; color: #e8edf7; }
    button, input, select { padding: .55rem; margin: .2rem; }
    section { padding: 1rem; margin: 1rem 0; background: #1b2230; border-radius: 8px; }
    .plugin { display: flex; gap: .5rem; align-items: center; border-top: 1px solid #344; padding: .6rem 0; }
    .plugin span { flex: 1; }
    small { color: #aab; }
    #upload-status { color: #aab; }
    textarea { width: min(100%, 34rem); min-height: 5rem; box-sizing: border-box; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; }
    .status { color: #aab; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Luna</h1>
  <p id="device"></p>
  <section>
    <h2>Пакеты</h2>
    <form id="upload"><input id="package-file" type="file" name="package" accept=".yap" required><button>Установить .yap</button><small id="upload-status"></small></form>
    <div id="plugins"></div>
  </section>
  <section>
    <h2>LED</h2>
    <p><small>Цвета через запятую. Распределение по реальному числу LED делает Luna.</small></p>
    <input id="colors" value="#4285F4,#EA4335,#FBBC05" size="40">
    <div class="row">
      <button onclick="setLed('/led')">Ring + logo</button>
      <button onclick="setLed('/led/ring')">Только ring</button>
      <button id="logo-set" onclick="setLed('/led/logo')">Только logo</button>
      <button onclick="turnOff('/led/off')">Выключить всё</button>
      <button onclick="turnOff('/led/off/ring')">Выключить ring</button>
      <button id="logo-off" onclick="turnOff('/led/off/logo')">Выключить logo</button>
    </div>
    <p class="status" id="led-status"></p>
  </section>
  <section>
    <h2>Часы</h2>
    <div class="row">
      <label>Время <input id="clock-time" value="12:34" pattern="[0-9]{1,2}:[0-9]{2}"></label>
      <label>Яркость <input id="clock-brightness" type="number" min="0" max="255" value="170"></label>
      <button onclick="setClockTime()">Показать время</button>
      <button onclick="turnOffClock()">Выключить часы</button>
    </div>
    <p><small>Для отдельных сегментов — JSON вида {"A0":255,"B0":255}.</small></p>
    <textarea id="clock-segments">{"A0":255,"B0":255}</textarea><br>
    <button onclick="setClockSegments()">Установить сегменты</button>
    <button onclick="loadClock()">Обновить информацию</button>
    <p class="status" id="clock-status"></p>
  </section>
  <section>
    <h2>Настройки</h2>
    <label>Профиль <select id="profile"><option>mini2</option><option>micro</option><option>midi</option><option>plum</option><option>sysfs-ring</option><option>custom</option></select></label>
    <label>LED count <input id="count" type="number" min="1" max="128"></label>
    <label><input id="binaries" type="checkbox"> Разрешить бинарники плагинов</label>
    <label><input id="updates" type="checkbox"> Автообновление YAM из GitHub Releases</label>
    <button onclick="saveSettings()">Сохранить</button>
  </section>
<script>
const api = '/api';
const deviceElement = document.getElementById('device');
const pluginsElement = document.getElementById('plugins');
const uploadForm = document.getElementById('upload');
const packageFile = document.getElementById('package-file');
const uploadStatus = document.getElementById('upload-status');
const profileInput = document.getElementById('profile');
const countInput = document.getElementById('count');
const binariesInput = document.getElementById('binaries');
const updatesInput = document.getElementById('updates');
const colorsInput = document.getElementById('colors');
const ledStatus = document.getElementById('led-status');
const clockStatus = document.getElementById('clock-status');
async function request(path, options) {
  const response = await fetch(api + path, options);
  if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || response.statusText);
  return response;
}
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
function pluginRow(plugin) {
  const { manifest, enabled, running, compatible, incompatibility } = plugin;
  const id = escapeHtml(manifest.id);
  const service = plugin.service_enabled === true;
  const run = compatible ? (running ? 'Перезапустить' : 'Запустить') : 'Несовместим';
  const disabled = compatible ? '' : `disabled title="${escapeHtml(incompatibility)}"`;
  const stop = running ? `<button onclick="action('${id}', 'stop')">Остановить</button>` : '';
  const launch = service ? `<button ${disabled} onclick="action('${id}', 'service/start')">${run}</button>` : `<button ${disabled} onclick="action('${id}', 'invoke')">Запустить</button>`;
  return `<div class="plugin"><span><b>${escapeHtml(manifest.name)}</b> <small>${id} · ${escapeHtml(manifest.version)} · ${service ? 'autostart' : 'manual'}<br>${escapeHtml(manifest.description)}</small></span><button onclick="action('${id}', 'toggle')">${enabled ? 'Выключить' : 'Включить'}</button>${launch}${stop}<button onclick="action('${id}', 'delete')">Удалить</button></div>`;
}
async function load() {
  try {
    const [pluginData, settings, currentDevice] = await Promise.all([request('/plugins').then(r => r.json()), request('/settings').then(r => r.json()), request('/device').then(r => r.json())]);
    deviceElement.textContent = `Колонка: ${currentDevice.model} · ${currentDevice.architecture} · ${currentDevice.features.join(', ')}`;
    const hasLogo = currentDevice.led?.has_logo === true;
    document.getElementById('logo-set').disabled = !hasLogo;
    document.getElementById('logo-off').disabled = !hasLogo;
    pluginsElement.innerHTML = pluginData.map(pluginRow).join('') || 'Пакетов нет';
    profileInput.value = settings.led.profile;
    countInput.value = settings.led.count;
    binariesInput.checked = settings.allow_plugin_binaries;
    updatesInput.checked = settings.updates?.enabled !== false;
  } catch (error) { alert(error.message); }
}
async function action(id, name) {
  try { await request(`/plugins/${id}${name === 'delete' ? '' : `/${name}`}`, { method: name === 'delete' ? 'DELETE' : 'POST' }); await load(); } catch (error) { alert(error.message); }
}
uploadForm.onsubmit = async event => {
  event.preventDefault();
  const file = packageFile.files[0];
  if (!file) return;
  if (file.size > 67 * 1024 * 1024) return alert('Пакет больше 67 МиБ');
  uploadStatus.textContent = `Загрузка ${file.name}…`;
  try { const form = new FormData(); form.append('package', file, file.name); await request('/plugins', { method: 'POST', body: form }); uploadForm.reset(); await load(); uploadStatus.textContent = 'Установлено. Включите пакет перед запуском.'; } catch (error) { uploadStatus.textContent = ''; alert(error.message); }
};
function colors() { return colorsInput.value.split(',').map(c => c.trim()).filter(Boolean); }
async function setLed(path) {
  try { await request(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ colors: colors() }) }); ledStatus.textContent = `OK: POST ${api}${path}`; }
  catch (error) { ledStatus.textContent = `Ошибка: ${error.message}`; }
}
async function turnOff(path) {
  try { await request(path, { method: 'POST' }); ledStatus.textContent = `OK: POST ${api}${path}`; }
  catch (error) { ledStatus.textContent = `Ошибка: ${error.message}`; }
}
async function loadClock() {
  try {
    const clock = await request('/clock').then(r => r.json());
    clockStatus.textContent = clock.available ? `Доступны сегменты: ${clock.segments.join(', ')}` : 'Часы недоступны';
  } catch (error) { clockStatus.textContent = `Ошибка: ${error.message}`; }
}
async function setClockTime() {
  try {
    await request('/clock', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ time: document.getElementById('clock-time').value, brightness: Number(document.getElementById('clock-brightness').value) }) });
    clockStatus.textContent = 'Время установлено';
  } catch (error) { clockStatus.textContent = `Ошибка: ${error.message}`; }
}
async function setClockSegments() {
  try {
    const segments = JSON.parse(document.getElementById('clock-segments').value);
    await request('/clock', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ segments }) });
    clockStatus.textContent = 'Сегменты установлены';
  } catch (error) { clockStatus.textContent = `Ошибка: ${error.message}`; }
}
async function turnOffClock() {
  try { await request('/clock/off', { method: 'POST' }); clockStatus.textContent = 'Часы выключены'; }
  catch (error) { clockStatus.textContent = `Ошибка: ${error.message}`; }
}
async function saveSettings() {
  try { const settings = await request('/settings').then(r => r.json()); settings.led.profile = profileInput.value; settings.led.count = Number(countInput.value); settings.allow_plugin_binaries = binariesInput.checked; settings.updates = { ...(settings.updates || {}), enabled: updatesInput.checked }; await request('/settings', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(settings) }); } catch (error) { alert(error.message); }
}
load().then(loadClock);
</script>
</body>
</html>
